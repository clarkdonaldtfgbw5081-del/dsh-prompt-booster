---
name: Feature request
description: 提出功能或体验改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不是先给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / 取舍
    validations:
      required: false
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 这个建议不需要自动发送消息
          required: true
        - label: 这个建议不要求新增遥测或持久化用户正文
          required: true
        - label: 我理解当前 DSH 版本固定为 0.2.1-rc.2
          required: false
