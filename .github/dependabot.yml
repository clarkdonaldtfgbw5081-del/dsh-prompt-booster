version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # DSH 的接口按精确版本固定；升级需要人工验证兼容性。
    ignore:
      - dependency-name: "@deepseek-ai/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
